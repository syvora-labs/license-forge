# ============================================================
# License Forge — Production Overlay
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  --env-file .env.prod up -d --build
# ============================================================

# YAML anchor — applied to every service in the overlay
x-prod-defaults: &prod-defaults
    restart: unless-stopped
    security_opt:
        - no-new-privileges:true
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

services:

    # --------------------------------------------------------
    # Outer nginx — TLS termination, three vhosts, ACME
    # --------------------------------------------------------
    nginx:
        <<: *prod-defaults
        container_name: supabase-nginx
        image: jonasal/nginx-certbot:6.0.1-nginx1.29.5
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            kong:
                condition: service_healthy
            studio:
                condition: service_healthy
            web:
                condition: service_started
        environment:
            PROXY_DOMAIN: ${PROXY_DOMAIN}
            CERTBOT_EMAIL: ${CERTBOT_EMAIL}
            PROXY_AUTH_USERNAME: ${DASHBOARD_USERNAME}
            PROXY_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
            STUDIO_ALLOWED_CIDRS: ${STUDIO_ALLOWED_CIDRS}
        command:
            - /bin/bash
            - -c
            - |
                set -eu
                # 1. Generate IP allowlist file from env (empty STUDIO_ALLOWED_CIDRS => empty file => deny all)
                : > /etc/nginx/user_conf.d/studio-allowlist.conf
                for cidr in $${STUDIO_ALLOWED_CIDRS}; do
                    echo "allow $${cidr};" >> /etc/nginx/user_conf.d/studio-allowlist.conf
                done

                # 2. Generate htpasswd for studio basic auth
                printf '%s:%s\n' "$${PROXY_AUTH_USERNAME}" "$$(openssl passwd -apr1 "$${PROXY_AUTH_PASSWORD}")" \
                    > /etc/nginx/user_conf.d/dashboard-passwd

                # 3. Render template (envsubst only the vars we want)
                envsubst '$${PROXY_DOMAIN}' \
                    < /etc/nginx/supabase-nginx-prod.conf.tpl \
                    > /etc/nginx/user_conf.d/nginx.conf

                # 4. Start nginx + certbot (image's existing entrypoint)
                /scripts/start_nginx_certbot.sh
        volumes:
            - ./volumes/proxy/nginx/supabase-nginx-prod.conf.tpl:/etc/nginx/supabase-nginx-prod.conf.tpl:ro
            - nginx_letsencrypt:/etc/letsencrypt
        cap_drop: [ALL]
        # NET_BIND_SERVICE: bind :80/:443. CHOWN/SETUID/SETGID: drop privileges to nginx user after binding.
        # DAC_OVERRIDE: jonasal/nginx-certbot writes certs across UID boundaries during renewal.
        cap_add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        mem_limit: 128m
        cpus: 0.5

    # --------------------------------------------------------
    # Frontend — built static SPA served by nginx-unprivileged
    # --------------------------------------------------------
    web:
        <<: *prod-defaults
        container_name: supabase-web
        build:
            context: ../..
            dockerfile: web/Dockerfile.prod
            args:
                VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
                VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        ports: !reset []
        expose:
            - "8080"
        # Strip dev volumes inherited from base (../..:/repo etc.) — prod uses the built dist baked into the image
        volumes: !reset []
        read_only: true
        # nginx-unprivileged writes proxy_temp/client_temp/nginx.pid under /tmp.
        tmpfs:
            - /tmp:size=32M,mode=1777
        cap_drop: [ALL]
        mem_limit: 64m
        cpus: 0.25

    # --------------------------------------------------------
    # Strip host ports on services that should be internal-only
    # --------------------------------------------------------
    kong:
        <<: *prod-defaults
        ports: !reset []
        environment:
            KONG_PORT_MAPS: "443:8000,443:8443"
            # The kong image installs its libraries (libada.so, etc.) under /usr/local/kong,
            # so we cannot tmpfs that path — it would hide the libraries. Relocate Kong's
            # writable runtime prefix and the rendered declarative config under /tmp instead.
            KONG_PREFIX: /tmp/kong
            # /tmp exists at start; /tmp/kong (KONG_PREFIX) is created by kong, not the entrypoint,
            # so the rendered declarative config must live in /tmp directly.
            KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
        read_only: true
        tmpfs:
            # /tmp now holds nginx temp dirs, the rendered kong.yml, and the LMDB cache
            # (under KONG_PREFIX=/tmp/kong) — 64M is too tight, OpenResty workers OOM.
            - /tmp:size=256M,mode=1777
        cap_drop: [ALL]
        mem_limit: 768m
        cpus: 0.5

    supavisor:
        <<: *prod-defaults
        ports: !reset []
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    # --------------------------------------------------------
    # Stateless services — read-only filesystem, dropped caps
    # --------------------------------------------------------
    auth:
        <<: *prod-defaults
        environment:
            GOTRUE_MAILER_AUTOCONFIRM: "${ENABLE_EMAIL_AUTOCONFIRM:-true}"
            GOTRUE_EXTERNAL_EMAIL_ENABLED: "${ENABLE_EMAIL_SIGNUP:-false}"
            # Prod design = no email signup. Hardcoded; flip to "false" if you also flip ENABLE_EMAIL_SIGNUP=true.
            GOTRUE_DISABLE_SIGNUP: "true"
            GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "${ENABLE_ANONYMOUS_USERS:-false}"
            GOTRUE_SMTP_HOST: ""
            GOTRUE_SMTP_USER: ""
            GOTRUE_SMTP_PASS: ""
            GOTRUE_SMTP_ADMIN_EMAIL: ""
        read_only: true
        tmpfs:
            - /tmp:size=32M,mode=1777
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    rest:
        <<: *prod-defaults
        read_only: true
        tmpfs:
            - /tmp:size=32M,mode=1777
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    realtime:
        <<: *prod-defaults
        read_only: true
        tmpfs:
            - /tmp:size=64M,mode=1777
        cap_drop: [ALL]
        # Realtime entrypoint runs `sudo -E -u nobody /app/bin/migrate` to drop privileges.
        # SETUID/SETGID for setresuid; AUDIT_WRITE for sudo's audit plugin (sudoers_audit).
        cap_add:
            - SETUID
            - SETGID
            - AUDIT_WRITE
        mem_limit: 512m
        cpus: 0.5

    meta:
        <<: *prod-defaults
        read_only: true
        tmpfs:
            - /tmp:size=32M,mode=1777
        cap_drop: [ALL]
        mem_limit: 128m
        cpus: 0.25

    imgproxy:
        <<: *prod-defaults
        read_only: true
        tmpfs:
            - /tmp:size=64M,mode=1777
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    # --------------------------------------------------------
    # Stateful or runtime-write services — caps dropped, no read-only
    # --------------------------------------------------------
    db:
        <<: *prod-defaults
        cap_drop: [ALL]
        # Postgres entrypoint runs as root to fix perms on the persisted data dir,
        # then drops to the postgres user via gosu. Needs FOWNER/CHOWN to repair an
        # existing PGDATA, DAC_READ_SEARCH to traverse it, and SETUID/SETGID to gosu.
        cap_add:
            - CHOWN
            - DAC_READ_SEARCH
            - FOWNER
            - SETUID
            - SETGID
        mem_limit: 2g
        cpus: 2.0

    storage:
        <<: *prod-defaults
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    # Logflare — writes Logflare state, not flipped read-only here
    analytics:
        <<: *prod-defaults
        cap_drop: [ALL]
        mem_limit: 512m
        cpus: 0.5

    # Studio — Next.js, may write to .next/cache; not flipped read-only here
    studio:
        <<: *prod-defaults
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

    # Edge functions — Deno cache lives on a volume, but the runtime may write elsewhere
    functions:
        <<: *prod-defaults
        cap_drop: [ALL]
        mem_limit: 512m
        cpus: 1.0

    # Vector — base already mounts the docker socket as :ro,z, no override needed
    # security_opt: Compose v5 merges security_opt additively across overlay files.
    # The base docker-compose.yml supplies label=disable (needed on SELinux hosts to read
    # the docker socket) and the *prod-defaults anchor supplies no-new-privileges:true.
    # Both end up in the final merged config. An explicit security_opt block here would
    # duplicate label=disable from the base and fail Compose v5 validation.
    vector:
        <<: *prod-defaults
        read_only: true
        tmpfs:
            - /tmp:size=64M,mode=1777
            - /var/lib/vector:size=128M,mode=0755
        cap_drop: [ALL]
        mem_limit: 256m
        cpus: 0.5

volumes:
    nginx_letsencrypt:
